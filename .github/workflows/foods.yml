name: Sync community food data
on:
  schedule:
    - cron: '3-58/5 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  id-token: write
concurrency:
  group: community-food-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/sync-foods.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
