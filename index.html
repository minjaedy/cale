<body>
  <div id="startup" class="entry"><div class="entry-inner"><p class="entry-word">TEMPO<span>.</span></p><p class="entry-tag"></p><div class="entry-scan" aria-hidden="true"></div><p class="entry-status">불러오는 중</p><button class="entry-guest" id="startupFallback" hidden>루틴으로 계속</button></div></div>
  <div class="app" id="app" inert>
    <header class="app-header">
      <div class="brand"><div class="brand-mark" aria-hidden="true"><img src="./icon.svg?v=2" alt="" width="48" height="48"></div><div><h1>TEMPO<span class="brand-period">.</span></h1><p></p></div></div>
      <button class="btn primary" id="addBtn" type="button"><span data-icon="calendar"></span>기본 루틴</button>

      <button class="nav-btn" id="nav-diet" role="tab" aria-controls="page-diet" aria-selected="false" tabindex="-1" type="button" data-page="diet"><span data-icon="leaf"></span><span>식단</span></button>

    <main>
      <section id="page-routine" role="tabpanel" aria-labelledby="nav-routine">
        <div class="page-heading"><div><button class="calendar-label eyebrow" id="calendarLabel" data-profile-edit>나의 루틴 ↗</button><h2 id="monthLabel"></h2></div><div class="week-actions"><button class="btn" id="wkToday" type="button">이번 주</button><button class="icon-btn" id="wkPrev" type="button" aria-label="지난 주"><span data-icon="left"></span></button><button class="icon-btn" id="wkNext" type="button" aria-label="다음 주"><span data-icon="right"></span></button></div></div>
        <div class="calendar-tools" id="calendarTools"><label>날짜<input id="calendarDate" type="date" aria-label="날짜 이동"></label><span>기록 1년 보관</span></div>

    <footer class="app-footer"><span class="footer-brand">TEMPO</span></footer>
  </div>
  <div class="modal" id="editor" hidden><div class="scrim" data-close="editor"></div><form class="sheet" id="eventForm" role="dialog" aria-modal="true" aria-labelledby="formTitle" novalidate><div class="sheet-handle" aria-hidden="true"></div><div class="sheet-header"><h2 id="formTitle">새 일정</h2><button class="icon-btn" type="button" data-close="editor" aria-label="일정 편집 닫기"><span data-icon="close"></span></button></div><div class="sheet-body"><label class="field">일정 이름<input id="fTitle" type="text" maxlength="40" placeholder="일정 이름" autocomplete="off" required></label><div class="field-row"><label class="field">시작<input id="fStart" type="time" step="300" required></label><label class="field">종료<input id="fEnd" type="time" step="300" required></label></div><label class="field">분류<select id="fCat"></select></label><fieldset class="form-days"><legend>반복할 요일</legend><div class="repeat-presets"><button type="button" data-days="0,1,2,3,4,5,6">매일</button><button type="button" data-days="0,1,2,3,4">평일</button><button type="button" data-days="5,6">주말</button></div><div class="day-choices" id="fDays"></div></fieldset><label class="field">메모 <textarea id="fNote" maxlength="300" placeholder="선택 입력"></textarea></label><p class="error-text" id="formError" role="alert" hidden></p></div><div class="sheet-actions"><button type="button" class="btn danger ghost delete" id="deleteBtn">삭제</button><button type="button" class="btn" data-close="editor">취소</button><button type="submit" class="btn primary">저장</button></div></form></div>
  <div class="modal" id="confirmModal" hidden><div class="scrim" data-close="confirmModal"></div><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="confirmTitle"><div class="sheet-handle" aria-hidden="true"></div><div class="sheet-header"><h2 id="confirmTitle">기본 루틴으로 되돌릴까요?</h2><button class="icon-btn" type="button" data-close="confirmModal" aria-label="확인창 닫기"><span data-icon="close"></span></button></div><div class="sheet-body"><p class="sheet-copy">추가하거나 수정한 일정이 기본 루틴으로 바뀝니다. 완료 체크, 몸무게와 식사 기록은 그대로 남아요.</p></div><div class="sheet-actions"><button class="btn" type="button" data-close="confirmModal">취소</button><button class="btn primary" type="button" id="confirmReset">되돌리기</button></div></div></div>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  <div class="sr-only" id="announcer" role="status" aria-live="polite"></div>
  <script>
/* TEMPO keeps the original calendar and tracker storage keys. */
const EVENT_KEY='minjae-routine-v8', LOG_KEY='minjae-tracker-v1';
const GUEST_EVENTS='tempo-guest-events',GUEST_LOGS='tempo-guest-logs';let activeEventKey=GUEST_EVENTS,activeLogKey=GUEST_LOGS,personalProfile={},accountRole='member',legacyAccount=false;let routineCore,planView,calendarCore,retentionCore;const coreReady=Promise.all([import('./account-core.mjs?v=3').then(m=>routineCore=m),import('./routine-plan.js?v=3').then(m=>planView=m),import('./calendar-core.mjs?v=3').then(m=>calendarCore=m),import('./retention-core.mjs?v=3').then(m=>retentionCore=m)]);
const DAYS=['월','화','수','목','금','토','일'];
const CATS={str:{name:'근력',color:'var(--c-str)'},cardio:{name:'유산소',color:'var(--c-cardio)'},jp:{name:'공부',color:'var(--c-jp)'},work:{name:'업무',color:'var(--c-work)'},commute:{name:'이동',color:'var(--c-commute)'},life:{name:'생활',color:'var(--c-life)'},rest:{name:'휴식·수면',color:'var(--c-rest)'}};
const HABITS=[['str','근력'],['run','유산소'],['diet','식단'],['steps','8천 보'],['jp','공부'],['sleep','제때 취침']];
const MEALS={breakfast:'아침',lunch:'점심',snack:'간식',dinner:'저녁'};
function e(day,start,end,title,cat,note=''){return {day,start,end,title,cat,note}}
function defaults(){
  const L=[];
  const workout={0:['근력','20:30',''],1:['근력','20:30',''],
    3:['근력','20:40',''],4:['근력','20:30','']};
  for(let d=0;d<5;d++){
    if(d===2){L.push(e(d,'06:30','07:05','유산소','cardio',''));L.push(e(d,'07:05','07:20','근력','str'));}
    L.push(e(d,'07:20','07:50','준비·아침','life'));
    L.push(e(d,'07:50','09:00','출근','commute','이동 중 일본어 단어 15분'));
    L.push(e(d,'09:00','18:00','근무','work'));
    L.push(e(d,'18:00','19:00','퇴근','commute'));
    if(workout[d]){const w=workout[d];L.push(e(d,'19:30',w[1],w[0],'str'));L.push(e(d,w[1],'21:00','유산소','cardio',w[2]));
      L.push(e(d,'21:00','21:40','저녁 식사','life'));}
    if(d===2){L.push(e(d,'19:00','19:40','저녁 식사','life'));
      L.push(e(d,'21:30','22:20','일본어 수업','jp'));
      L.push(e(d,'22:20','22:35','복습','jp'));}
    L.push(e(d,d===1?'23:00':'23:30','24:00','취침','rest',d===1?'수요일 아침 운동 대비':''));
  }
  return L.map((x,i)=>({id:'d'+i,...x}));
}

const $=id=>document.getElementById(id),pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const monday=d=>{const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-(x.getDay()+6)%7);return x};
const toMin=t=>{const [h,m]=t.split(':').map(Number);return h*60+m},endMin=t=>t==='00:00'?1440:toMin(t);
const dur=m=>{const h=Math.floor(m/60),r=m%60;return (h?h+'시간':'')+(h&&r?' ':'')+(r?r+'분':'')||'0분'};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const icons={plus:'<path d="M12 5v14M5 12h14"/>',left:'<path d="m14 6-6 6 6 6"/>',right:'<path d="m10 6 6 6-6 6"/>',close:'<path d="m6 6 12 12M6 18 18 6"/>',check:'<path d="m5 12 4 4L19 6"/>',calendar:'<rect x="4" y="5" width="16" height="16" rx="2"/><path d="M8 3v4m8-4v4M4 10h16m-12 5 3 3 5-5"/>',chart:'<path d="M4 20h16M6 15v-4m6 4V7m6 8V3"/>',leaf:'<path d="M5 3v6a3 3 0 0 0 6 0V3M8 3v18M17 3v9h3M20 3v18"/>',lock:'<rect x="5" y="10" width="14" height="11" rx="3"/><path d="M8 10V7a4 4 0 0 1 8 0v3m-4 4v3"/>',edit:'<path d="m14 5 5 5M4 20l5-1L20 8a2 2 0 0 0-4-4L5 15l-1 5Z"/>'};
const icon=n=>'<svg class="icon" viewBox="0 0 24 24" aria-hidden="true">'+(icons[n]||icons.check)+'</svg>';
document.querySelectorAll('[data-icon]').forEach(el=>el.outerHTML=icon(el.dataset.icon));
function normalizeRoutine(list){return list.map(x=>{if(!/^d\d+$/.test(x.id||''))return x;const titles=["근력 · 가슴·어깨·삼두","근력 · 등·이두","근력 · 하체","근력 · 상체 전체","근력 · 코어"],notes=['러닝 30분 (달리기·걷기 섞어서)','러닝 20분 (가볍게)','5km 또는 인터벌'];return {...x,title:titles.includes(x.title)?'근력':x.title==='유산소 · 러닝'?'유산소':x.title,note:notes.includes(x.note)?'':x.note};})}
let storageError=false, events,logs;
try{events=JSON.parse(localStorage.getItem(GUEST_EVENTS)||'null')}catch{storageError=true}
if(!Array.isArray(events))events=[];events=normalizeRoutine(events);
try{logs=JSON.parse(localStorage.getItem(GUEST_LOGS)||'{}')||{}}catch{logs={};storageError=true}
if(typeof logs!=='object'||Array.isArray(logs))logs={};
let today=ymd(new Date()),weekStart=monday(new Date()),selectedDay=(new Date().getDay()+6)%7,page='routine',view='day',editingId=null,deleteArmed=false,modalOpener=null,scrollLock=0,activeModal=null,toastTimer,cloud=null;
let checksExpanded=!matchMedia('(max-width:760px)').matches;
let storageMessage=storageError?'저장소를 읽지 못했어요. 브라우저의 저장 공간 설정을 확인해 주세요.':'이 브라우저에 자동 저장돼요. 다른 기기와는 연동되지 않아요.';
const reduceMotion=()=>matchMedia('(prefers-reduced-motion: reduce)').matches;
function weekDates(){return DAYS.map((_,i)=>{const d=new Date(weekStart);d.setDate(d.getDate()+i);return d})}
function selectedDate(){return weekDates()[selectedDay]}
function selectedKey(){return ymd(selectedDate())}
function dayLog(ds=selectedKey()){return logs[ds]||{items:{}}}
function doneCount(ds){return HABITS.filter(([k])=>dayLog(ds).items?.[k]).length}
function calendarExpired(ds){return !calendarCore||!calendarCore.hasHistory(ds,today)}
function locked(ds){return ds>today||calendarExpired(ds)}function weightLocked(ds){return locked(ds)}
function alignCalendar(){const next=calendarCore.clampSelection(ymd(weekStart),selectedDay,today);weekStart=new Date(next.week+'T12:00:00');selectedDay=next.day;}
function pruneLocal(){if(!retentionCore)return;logs=retentionCore.pruneDays(logs);try{localStorage.setItem(activeLogKey,JSON.stringify(logs))}catch{}}
function itemKey(x){if(x.cat==='str')return'str';if(x.cat==='cardio')return'run';if(x.cat==='jp')return'jp';if(x.cat==='rest'&&x.title.includes('취침'))return'sleep';return null}
function mealKey(x){if(x.cat==='work')return'lunch';if(x.title.includes('아침'))return'breakfast';if(x.title.includes('저녁'))return'dinner';if(x.cat==='commute'&&x.title.includes('퇴근'))return'snack';return null}
function announce(s){$('announcer').textContent=s}
function notify(s){clearTimeout(toastTimer);$('toast').textContent=s;$('toast').hidden=false;toastTimer=setTimeout(()=>$('toast').hidden=true,2600)}
function persistEvents(){try{localStorage.setItem(activeEventKey,JSON.stringify(events));window.TempoCloud?.eventsChanged(events);return true}catch{notify('저장하지 못했어요. 브라우저 저장 공간을 확인해 주세요.');return false}}
function persistLog(ds,patch){try{localStorage.setItem(activeLogKey,JSON.stringify(logs));storageError=false}catch{storageError=true;storageMessage='저장하지 못했어요. 브라우저의 저장 공간을 확인해 주세요.';notify(storageMessage)}window.TempoCloud?.logChanged(ds,patch);}
function animate(el,direction=1){if(reduceMotion()||!el)return;el.animate([{opacity:.35,transform:'translateY(7px)'},{opacity:1,transform:'translateY(0)'}],{duration:230,easing:'cubic-bezier(.2,.8,.2,1)'});}
function animateRing(from,to){const el=$('progressRing');if(!el)return;if(reduceMotion()){el.style.setProperty('--progress',to);return}const start=performance.now();function frame(t){if(!el.isConnected)return;const p=Math.min((t-start)/400,1);el.style.setProperty('--progress',from+(to-from)*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(frame)}requestAnimationFrame(frame)}
function renderDays(){alignCalendar();$('wkPrev').disabled=!calendarCore.canMoveBack(ymd(weekStart),today);$('calendarDate').min=retentionCore.historyStart(today);$('calendarDate').value=selectedKey();const dates=weekDates(),last=dates[6];$('monthLabel').textContent=dates[0].getFullYear()+'년 '+(dates[0].getMonth()+1)+'월'+(last.getMonth()!==dates[0].getMonth()?' – '+(last.getMonth()+1)+'월':'');$('dayNav').innerHTML=dates.map((d,i)=>'<button type="button" class="day-btn" data-day="'+i+'" '+(calendarExpired(ymd(d))?'disabled':'')+' aria-pressed="'+(selectedDay===i)+'" aria-label="'+(d.getMonth()+1)+'월 '+d.getDate()+'일 '+DAYS[i]+'요일'+(ymd(d)===today?', 오늘':'')+'"><span class="weekday">'+DAYS[i]+'</span><span class="date">'+d.getDate()+'</span>'+(ymd(d)===today?'<i class="today-dot" aria-hidden="true"></i>':'')+'</button>').join('')}
function viewSwitch(){return'<div class="view-switch" role="group" aria-label="일정 보기"><button type="button" data-view="day" aria-pressed="'+(view==='day')+'">하루</button><button type="button" data-view="week" aria-pressed="'+(view==='week')+'">주간</button><button type="button" data-view="plan" aria-pressed="'+(view==='plan')+'">기본 루틴</button></div>'}
function eventsOn(ds){if(calendarExpired(ds))return [];const day=(new Date(ds+'T12:00:00').getDay()+6)%7;return events.filter(x=>x.day===day)}
function eventDone(x,ds){const lg=dayLog(ds);return typeof lg.completed?.[x.id]==='boolean'?lg.completed[x.id]:!lg.completed&&!!lg.items?.[itemKey(x)]}
function eventProgress(ds){const list=eventsOn(ds);return {total:list.length,done:list.filter(x=>eventDone(x,ds)).length}}
function completionBase(ds){const lg=dayLog(ds);return lg.completed?{...lg.completed}:Object.fromEntries(eventsOn(ds).map(x=>[x.id,eventDone(x,ds)]))}
function focusCard(){const ds=selectedKey(),p=eventProgress(ds),date=selectedDate(),isToday=ds===today,title=locked(ds)?(ds>today?'예정':'보관 기간 종료'):p.total&&p.done===p.total?'모두 완료':'일정 체크';return '<div class="focus-card"><div class="focus-top"><div><p class="eyebrow">'+(isToday?'TODAY':(date.getMonth()+1)+'.'+pad(date.getDate()))+' · '+DAYS[selectedDay]+'요일</p><h3>'+title+'</h3><p class="context">'+(locked(ds)?(ds>today?'해당 날짜부터 체크 가능':'1년 보관'):p.done+' / '+p.total+' 완료')+'</p></div><div class="progress-ring" id="progressRing" style="--progress:'+(p.total?p.done/p.total*100:0)+'" role="img" aria-label="일정 '+p.total+'개 중 '+p.done+'개 완료"><span class="ring-value">'+p.done+'<small> / '+p.total+'</small></span></div></div></div>'}

function recordCard(){const ds=selectedKey(),lg=dayLog(ds),lock=locked(ds);return '<details class="daily-record" id="dailyChecks" '+(checksExpanded?'open':'')+'><summary><span>하루 체크</span><span class="check-summary">습관 '+icon('right')+'</span></summary><div class="record-body"><div class="quick-checks">'+HABITS.map(([k,n])=>'<button type="button" class="habit-btn" data-habit="'+k+'" aria-label="'+n+' 완료" aria-pressed="'+!!lg.items?.[k]+'" '+(lock?'disabled':'')+'><span class="check-box">'+icon('check')+'</span>'+n+'</button>').join('')+'</div><p class="record-note">'+(lock?(ds>today?'예정':'보관 기간 종료'):'1년 보관 · 자동 저장')+'</p></div></details>'}

  guestSnapshot:()=>({events:readStored(GUEST_EVENTS,[]),logs:readStored(GUEST_LOGS,{})}),
  notify,
  setRole(role){accountRole=role;},
  setProfile(profile){if(JSON.stringify(profile)===JSON.stringify(personalProfile))return;personalProfile={...profile};$('calendarLabel').textContent=(profile.calendarName||'나의 루틴')+' ↗';if(page==='records'&&!document.activeElement?.matches('input,textarea'))renderRecords();window.dispatchEvent(new Event('tempo-profile'));},
  setAccount(uid,legacy=false){legacyAccount=legacy;personalProfile={};accountRole='member';activeEventKey=uid?EVENT_KEY+':'+uid:GUEST_EVENTS;activeLogKey=uid?LOG_KEY+':'+uid:GUEST_LOGS;events=readStored(activeEventKey,legacy?readStored(EVENT_KEY,defaults()):[]);logs=readStored(activeLogKey,legacy?readStored(LOG_KEY,{}):{});if(!Array.isArray(events))events=legacy?defaults():[];events=normalizeRoutine(events);if(!logs||typeof logs!=='object')logs={};if(!activeModal)render();},
  receiveCloud(data){events=normalizeRoutine(data.events);logs=data.logs;try{localStorage.setItem(activeEventKey,JSON.stringify(events));localStorage.setItem(activeLogKey,JSON.stringify(logs))}catch{}if(!activeModal&&!document.activeElement?.matches('input,textarea'))render();},
  cloudStatus(state){cloudState=state;storageMessage=state.message;if(page==='records'&&!activeModal&&!document.activeElement?.matches('input,textarea,select'))renderRecords();}
};
document.addEventListener('click',ev=>{const b=ev.target.closest('button');if(!b)return;if(b.dataset.cloud){const c=window.TempoCloud;if(!c){notify('연결을 준비 중이에요. 인터넷 연결을 확인한 뒤 다시 시도해 주세요.');return;}({login:()=>c.login(),logout:()=>c.logout(),retry:()=>c.retry(),import:()=>c.importLocal()})[b.dataset.cloud]?.();}if(b.id==='exportBtn'){const data={app:'TEMPO',version:1,exportedAt:new Date().toISOString(),...window.Tempo.snapshot()},url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download='tempo-backup-'+today+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),10000);notify('기록 백업 파일을 만들었어요.');}});
  </script>
  <script>window.TempoCoachingUIReady=import('./coaching-ui.js?v=3').then(m=>{m.initUI();document.getElementById('startup').remove();return m;}).catch(()=>{const b=document.getElementById('startupFallback');b.hidden=false;b.onclick=()=>{document.getElementById('startup').remove();document.getElementById('app').inert=false;};});</script>
  <script src="./firebase-config.js"></script>
